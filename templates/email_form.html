{% extends "base.html" %}
{% block title %}Send study{% endblock %}
{% block content %}
	<h1>Send study by email</h1>
	<p class="subtitle">The recipient will receive a download link for this study.</p>

	<dl class="info">
		<div><dt>Patient</dt><dd>{{ patient or "—" }}</dd></div>
		<div><dt>Patient ID</dt><dd>{{ patientid or "—" }}</dd></div>
		<div><dt>Study date</dt><dd>{{ date or "—" }}</dd></div>
		<div><dt>Study</dt><dd class="mono">{{ uuid }}</dd></div>
	</dl>

	<form method="POST" onsubmit="this.querySelector('button').disabled = true">
		<label for="email">Recipient email</label>
		<input type="email" id="email" name="email" placeholder="name@example.com" required autofocus>
		<button type="submit">Send link</button>
	</form>
{% endblock %}
